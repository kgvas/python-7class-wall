<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Площадь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAFAF8;
    --grid:#D7E3ED;
    --ink:#1F2A37;
    --ink-soft:#5B6674;
    --red:#C81D25;
    --red-soft:#F4D9DA;
    --green:#1E7A46;
    --green-soft:#DCEEE1;
    --amber:#B9770E;
    --amber-soft:#FBEBD3;
    --card:#FFFFFF;
    --line:#E3E0D4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/100% 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 100%,
      var(--paper);
    background-attachment:local;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:32px 20px 60px;
  }
  .wrap{max-width:680px;margin:0 auto;}
  header{margin-bottom:22px;}
  h1{
    font-family:'Kalam',cursive;
    font-size:28px;
    color:var(--red);
    margin:0;
    transform:rotate(-1deg);
  }
  .sub{color:var(--ink-soft);font-size:14px;margin-top:4px;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:22px 24px;
    margin-bottom:18px;
  }
  .card h2{font-size:17px;margin:0 0 12px;font-weight:600;}
  label{font-size:13px;color:var(--ink-soft);display:block;margin-bottom:6px;}
  input[type=text]{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:15px;
    font-family:'Inter',sans-serif;
    background:#fff;
  }
  input[type=text]:focus{outline:2px solid var(--red-soft);border-color:var(--red);}
  textarea{
    width:100%;
    height:140px;
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
    line-height:1.5;
    padding:14px;
    border:1px solid var(--line);
    border-radius:8px;
    resize:vertical;
    background:#fff;
    color:var(--ink);
  }
  textarea:focus{outline:2px solid var(--red-soft);border-color:var(--red);}
  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:10px 20px;
    border-radius:8px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    cursor:pointer;
  }
  .btn:hover{background:#374151;}
  .btn.secondary{background:#fff;color:var(--ink);border-color:var(--line);}
  .btn.secondary:hover{background:#f3f2ee;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .task-box{
    background:var(--amber-soft);
    border:1px dashed var(--amber);
    border-radius:10px;
    padding:14px 16px;
    font-size:14px;
    line-height:1.6;
    margin-bottom:14px;
  }
  .stamp{
    font-family:'Kalam',cursive;
    font-size:22px;
    color:var(--red);
    border:2px solid var(--red);
    border-radius:8px;
    padding:8px 18px;
    display:inline-block;
    transform:rotate(-3deg);
    margin-top:10px;
  }
  .flag{
    display:inline-flex;align-items:center;gap:5px;
    padding:2px 8px;border-radius:20px;font-weight:600;font-size:11px;
  }
  .flag.ok{background:var(--green-soft);color:var(--green);}
  .flag.warn{background:var(--red-soft);color:var(--red);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--ink-soft);padding:8px 10px;border-bottom:2px solid var(--ink);
  }
  td{padding:9px 10px;border-bottom:1px solid #EFEDE5;vertical-align:top;}
  code.mini{
    display:block;white-space:pre-wrap;font-family:'JetBrains Mono',monospace;
    font-size:12px;background:#F0EEE6;padding:6px 8px;border-radius:6px;max-width:280px;
  }
  .score{font-weight:700;}
  .score.good{color:var(--green);}
  .score.bad{color:var(--red);}
  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:14px;}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:8px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ======================= НАЛАШТУВАННЯ ЗАВДАННЯ =======================
// Змінюйте тільки цей блок перед кожною новою контрольною.

const TASK_TITLE = "Перевірка: площа стіни (Python)";

const INSTRUCTION_TEXT = "Підійди до вчителя. Не підглядаючи в зошит чи телефон, продовж код по пам'яті — допиши останні рядки, які обчислюють і виводять площу стіни.";

// Рядки, які студент вже написав самостійно раніше — показуються як
// контекст перед полем відповіді, щоб було видно, що саме треба
// продовжити. Залиште порожнім рядком '', якщо контекст не потрібен.
const CONTEXT_CODE = `print ('Обозначим высоту комнату через переменную a, ширину комнаты через переменную b')
a = 3
b = 5
print ("Высота комнаты равна ", a)
print ("Ширина комнаты равна ", b)`;

// Еталонна відповідь. Порівняння ігнорує пробіли, переноси рядків і
// тип лапок ('...' або "..."), але враховує регістр, імена змінних і
// пунктуацію.
const EXPECTED_ANSWER = `s_wall=a*b
print ("Площадь стены равна ", s_wall)`;

// Скільки спроб дозволено в межах одного сеансу перед тим, як
// потрібен дозвіл вчителя на нову спробу.
const MAX_ATTEMPTS = 3;

// Той самий backend URL, що й у html-homework-checker.html.
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwV-7uv0mb15o2c3wFyFlG6RHiPoYqLOgTXXHA2bg8620b4SwQh8kljiqajZYDwSgeD/exec';

// Пароль для перегляду результатів викладачем.
const TEACHER_PASSCODE = 'вчитель2026';

// ===================== КІНЕЦЬ БЛОКУ НАЛАШТУВАНЬ =====================

function hashCode(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function slugify(str){
  // Слова сортуються, тож «Іван Петренко» і «Петренко Іван» дають один ідентифікатор.
  const words = str.trim().toLowerCase().replace(/ё/g,'е').split(/[^a-zа-яіїєґ0-9]+/i).filter(Boolean);
  return words.sort().join('-') || 'student';
}
function backendConfigured(){
  return APPS_SCRIPT_URL && APPS_SCRIPT_URL.indexOf('ВСТАВТЕ') === -1;
}
function teacherModeRequested(){
  return new URLSearchParams(location.search).has('admin');
}
function normalizeCode(str){
  return (str||'')
    .replace(/[’‘‚‛`´]/g, "'")
    .replace(/[“”„‟]/g, '"')
    .replace(/\s+/g, '');
}
function isAnswerCorrect(input){
  return normalizeCode(input) === normalizeCode(EXPECTED_ANSWER);
}
function localDoneKey(){ return 'memcheck-done:' + TASK_TITLE; }
function isDoneLocally(){
  try{ return !!localStorage.getItem(localDoneKey()); }catch(e){ return false; }
}
function markDoneLocally(){
  try{ localStorage.setItem(localDoneKey(), '1'); }catch(e){}
}

let state = {
  studentName: '',
  studentId: '',
  submitted: false,
  alreadySubmitted: false,
  finalOutcome: null, // 'correct' | 'failed' | null
  attemptsUsed: 0,
  pasteAttempts: 0,
  teacherUnlocked: false,
  teacherRows: []
};

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

async function submitCheck(record){
  if(!backendConfigured()) return {ok:false, error:'not_configured'};
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(record)
    });
    return await res.json();
  }catch(e){
    console.error('submit error', e);
    return {ok:false, error:'network'};
  }
}

async function loadResults(){
  if(!backendConfigured()) return [];
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?kind=memory', {cache:'no-store'});
    const rows = await res.json();
    return rows.filter(r => r.task === TASK_TITLE)
               .sort((a,b)=> (b.submittedAt||0) - (a.submittedAt||0));
  }catch(e){
    console.error('load error', e);
    return [];
  }
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';

  if(!backendConfigured()){
    app.appendChild(el(`
      <div class="card" style="border:1px solid var(--red);background:var(--red-soft);">
        <b style="color:var(--red);">Бекенд не налаштовано.</b>
        Відкрийте цей файл і замініть <code>APPS_SCRIPT_URL</code> на адресу
        вашого опублікованого Google Apps Script Web App.
      </div>
    `));
  }

  app.appendChild(el(`
    <header>
      <h1>${TASK_TITLE}</h1>
      <div class="sub">Здається один раз, у присутності вчителя</div>
    </header>
  `));

  const section = document.createElement('section');
  app.appendChild(section);

  if(teacherModeRequested()){
    renderTeacher(section);
  }else{
    renderStudent(section);
  }
}

function renderStudent(section){
  if(state.alreadySubmitted || (isDoneLocally() && !state.submitted)){
    section.appendChild(el(`
      <div class="card">
        <h2>Контрольну вже здано</h2>
        <p>Повторна спроба можлива лише з дозволу викладача.</p>
      </div>
    `));
    return;
  }

  if(!state.studentName){
    section.appendChild(el(`
      <div class="card">
        <h2>Представся</h2>
        <label for="name-input">Ім'я та прізвище</label>
        <input type="text" id="name-input" placeholder="Наприклад: Іван Петренко" />
        <div style="margin-top:14px;">
          <button class="btn" id="start-btn">Почати</button>
        </div>
      </div>
    `));
    section.querySelector('#start-btn').addEventListener('click', ()=>{
      const name = section.querySelector('#name-input').value.trim();
      if(!name){
        section.querySelector('#name-input').style.borderColor = 'var(--red)';
        return;
      }
      state.studentName = name;
      state.studentId = slugify(name);
      render();
    });
    section.querySelector('#name-input').addEventListener('keydown', e=>{
      if(e.key==='Enter') section.querySelector('#start-btn').click();
    });
    return;
  }

  if(state.submitted){
    const success = state.finalOutcome === 'correct';
    section.appendChild(el(`
      <div class="card">
        <h2>Дякую, ${state.studentName}!</h2>
        ${success
          ? `<div class="stamp">Здано</div>`
          : `<div class="stamp" style="color:var(--amber);border-color:var(--amber);">Спроби вичерпано</div>
             <p class="hint">Звернись до вчителя, якщо потрібна ще одна спроба.</p>`
        }
      </div>
    `));
    return;
  }

  const card = el(`
    <div class="card">
      <h2>${state.studentName}, твоя черга</h2>
      <div class="task-box">${INSTRUCTION_TEXT}</div>
      ${CONTEXT_CODE ? `
      <label>Код, який вже написано</label>
      <pre style="background:#F0EEE6;border-radius:8px;padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.5;white-space:pre-wrap;margin:0 0 14px;">${CONTEXT_CODE.replace(/</g,'&lt;')}</pre>
      ` : ''}
      <label for="answer-area">Продовження коду (за пам'яттю)</label>
      <textarea id="answer-area" spellcheck="false"></textarea>
      <p class="hint" id="attempts-left">Спроб залишилось: ${MAX_ATTEMPTS - state.attemptsUsed} з ${MAX_ATTEMPTS}</p>
      <p class="hint" id="paste-warning" style="color:var(--red);"></p>
      <div style="margin-top:14px;">
        <button class="btn" id="submit-btn">Здати</button>
      </div>
      <p class="hint" id="submit-error" style="color:var(--red);"></p>
    </div>
  `);
  section.appendChild(card);

  const textarea = card.querySelector('#answer-area');
  textarea.addEventListener('paste', (e)=>{
    e.preventDefault();
    state.pasteAttempts++;
    card.querySelector('#paste-warning').textContent =
      'Вставка через буфер обміну заблокована — пиши по пам\'яті.';
  });
  textarea.addEventListener('contextmenu', (e)=> e.preventDefault());

  card.querySelector('#submit-btn').addEventListener('click', async ()=>{
    const answer = textarea.value;
    if(!answer.trim()){
      card.querySelector('#submit-error').textContent = 'Поле порожнє.';
      return;
    }

    const correct = isAnswerCorrect(answer);
    const attemptsLeft = MAX_ATTEMPTS - state.attemptsUsed;

    // Невірна відповідь, і ще є спроби в межах ліміту — не фіксуємо
    // нічого на сервері, даємо спробувати ще раз одразу ж.
    if(!correct && attemptsLeft > 1){
      state.attemptsUsed++;
      card.querySelector('#submit-error').textContent =
        'Невірно. Спробуй ще раз (залишилось ' + (MAX_ATTEMPTS - state.attemptsUsed) + ').';
      card.querySelector('#attempts-left').textContent =
        'Спроб залишилось: ' + (MAX_ATTEMPTS - state.attemptsUsed) + ' з ' + MAX_ATTEMPTS;
      return;
    }

    // Або відповідь вірна, або спроби вичерпано — в обох випадках
    // фіксуємо остаточний результат на сервері.
    state.attemptsUsed++;
    const record = {
      kind: 'memory',
      task: TASK_TITLE,
      studentId: state.studentId,
      studentName: state.studentName,
      submittedCode: answer,
      isCorrect: correct,
      attemptsUsed: state.attemptsUsed,
      pasteAttempts: state.pasteAttempts,
      submittedAt: Date.now()
    };
    const btn = card.querySelector('#submit-btn');
    btn.disabled = true;
    btn.textContent = 'Надсилання…';
    const result = await submitCheck(record);
    if(result.ok || result.error === 'already_submitted'){
      markDoneLocally();
      state.submitted = true;
      state.finalOutcome = correct ? 'correct' : 'failed';
      render();
    }else{
      btn.disabled = false;
      btn.textContent = 'Здати';
      state.attemptsUsed--; // мережева помилка — не витрачаємо спробу
      card.querySelector('#submit-error').textContent = 'Помилка надсилання, спробуй ще раз.';
    }
  });
}

function renderTeacher(section){
  if(!state.teacherUnlocked){
    section.appendChild(el(`
      <div class="card" style="max-width:380px;">
        <h2>Вхід для викладача</h2>
        <label for="passcode-input">Пароль</label>
        <input type="text" id="passcode-input" placeholder="Введіть пароль" />
        <div style="margin-top:14px;">
          <button class="btn" id="unlock-btn">Увійти</button>
        </div>
        <p class="hint" id="passcode-error" style="color:var(--red);"></p>
      </div>
    `));
    const input = section.querySelector('#passcode-input');
    const tryUnlock = async ()=>{
      if(input.value === TEACHER_PASSCODE){
        state.teacherUnlocked = true;
        state.teacherRows = await loadResults();
        render();
      }else{
        section.querySelector('#passcode-error').textContent = 'Невірний пароль';
        input.style.borderColor = 'var(--red)';
      }
    };
    section.querySelector('#unlock-btn').addEventListener('click', tryUnlock);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
    return;
  }

  section.appendChild(el(`
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0;">Результати</h2>
        <span style="flex:1;"></span>
        <button class="btn secondary" id="refresh-btn">Оновити список</button>
      </div>
      <div id="teacher-table-holder"><div class="empty">Завантаження…</div></div>
    </div>
  `));
  section.querySelector('#refresh-btn').addEventListener('click', async ()=>{
    state.teacherRows = await loadResults();
    renderTeacherTable(section);
  });
  renderTeacherTable(section);
}

function renderTeacherTable(section){
  const holder = section.querySelector('#teacher-table-holder');
  if(!holder) return;
  if(state.teacherRows.length === 0){
    holder.innerHTML = '';
    holder.appendChild(el(`<div class="empty">Поки ніхто не здавав. Натисни «Оновити список» під час прийому.</div>`));
    return;
  }
  const table = el(`
    <table>
      <thead>
        <tr><th>Студент</th><th>Результат</th><th>Спроб</th><th>Що написав</th><th>Вставка</th><th>Час</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  `);
  const tbody = table.querySelector('tbody');
  state.teacherRows.forEach(r=>{
    const time = r.submittedAt ? new Date(r.submittedAt).toLocaleString('uk-UA') : '—';
    tbody.appendChild(el(`
      <tr>
        <td>${r.studentName}</td>
        <td class="score ${r.isCorrect?'good':'bad'}">${r.isCorrect?'✓ вірно':'✕ невірно'}</td>
        <td>${r.attemptsUsed || 1}/${MAX_ATTEMPTS}</td>
        <td><code class="mini">${(r.submittedCode||'').replace(/</g,'&lt;')}</code></td>
        <td>${r.pasteAttempts>0 ? '<span class="flag warn">'+r.pasteAttempts+'</span>' : '<span class="flag ok">нема</span>'}</td>
        <td>${time}</td>
      </tr>
    `));
  });
  holder.innerHTML = '';
  holder.appendChild(table);
}

render();
</script>
</body>
</html>
